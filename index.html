<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>QD</title>

<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#17242e;--muted:#8897a2;--line:#e8edf1;--s:#24a875;--a:#4b83f4;--b:#e6a12e;--lock:#f05c58}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit}.app{max-width:760px;margin:auto;padding-bottom:40px}.top{position:sticky;top:0;z-index:1000;background:rgba(246,248,251,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.days{display:flex;align-items:center;gap:6px;padding:8px 10px}.daybtn{border:0;background:transparent;color:#98a5ad;font-weight:900;padding:8px 11px;border-radius:12px}.daybtn.active{background:#152b38;color:#fff}.filters{margin-left:auto;display:flex;gap:3px}.fbtn{border:0;background:transparent;color:#a0acb3;font-size:10px;padding:6px}.fbtn.on{color:#263c49;font-weight:900}
.cover{height:178px;position:relative;background:#dfe7eb;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,25,35,.5))}.coverInfo{position:absolute;z-index:2;left:14px;right:14px;bottom:11px;color:#fff;display:flex;justify-content:space-between;align-items:end}.coverDate{font-size:12px;font-weight:900}.sourceLink{font-size:9px;color:rgba(255,255,255,.78);text-decoration:none}
.arrival{padding:11px 10px 7px;overflow:auto;display:flex;gap:7px;scrollbar-width:none}.arriveCard{min-width:105px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 9px;text-align:left;position:relative}.arriveCard:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:4px;background:var(--a)}.arriveCard.s:before{background:var(--s)}.arriveCard.b:before{background:var(--b)}.arriveCard.lock:before{background:var(--lock)}.arriveTime{font-size:11px;font-weight:900}.arriveName{font-size:11px;color:#667986;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arriveNo{font-size:9px;color:#a5b0b7;float:right}
.routePreview{height:auto;background:#eef2f5;padding:8px 10px 0}.routePreview img{display:block;width:100%;border-radius:18px;border:1px solid var(--line);background:#fff}
.summary{display:flex;gap:6px;padding:10px 10px 0;overflow:auto}.chip{white-space:nowrap;font-size:10px;font-weight:800;background:#fff;border:1px solid var(--line);padding:5px 8px;border-radius:999px;color:#60747f}
.legend{padding:7px 11px 2px;font-size:9px;color:#98a5ad}.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 3px 0 8px}.legend i:first-child{margin-left:0}.timeline{margin:8px 10px 0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}.timeline:before{content:"";position:absolute;left:63px;top:23px;bottom:23px;width:1px;background:#dde6eb}
.event{display:grid;grid-template-columns:50px 17px 1fr 58px;gap:7px;align-items:center;min-height:51px;padding:7px 10px;position:relative}.event+.event{border-top:1px solid #f1f4f6}.event.hidden{display:none}.etime{font-size:12px;font-weight:950;text-align:right}.edot{width:9px;height:9px;border-radius:50%;background:#c9d4da;z-index:2;box-shadow:0 0 0 4px white}.event.s .edot{background:var(--s)}.event.a .edot{background:var(--a)}.event.b .edot{background:var(--b)}.event.lock .edot{background:var(--lock)}.elabel{font-size:9px;color:#a0abb2;line-height:1.2}.ename{font-size:13px;font-weight:850;line-height:1.25;margin-top:2px}.prio{font-size:8px;font-weight:950;margin-left:4px}.s .prio{color:var(--s)}.a .prio{color:var(--a)}.b .prio{color:var(--b)}.lock .prio{color:var(--lock)}.eactions{display:flex;justify-content:flex-end;gap:4px}.ebtn{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#5b7180;padding:0}.event.done{opacity:.4}.event.done .ename{text-decoration:line-through}
.guideOverlay{position:fixed;inset:0;background:rgba(9,18,24,.35);z-index:3000;display:none}.guideOverlay.open{display:block}.guide{position:absolute;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:25px 25px 0 0;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.handle{width:36px;height:4px;border-radius:10px;background:#d9e1e5;margin:8px auto 7px}.ghead{padding:7px 15px 12px;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);z-index:10;border-bottom:1px solid var(--line)}.ghead h2{font-size:19px;margin:0}.gmeta{font-size:10px;color:#8a99a3;margin-top:2px}.close{position:absolute;right:13px;top:7px;border:0;background:#edf1f4;width:30px;height:30px;border-radius:50%}
.gallery{display:flex;gap:7px;overflow:auto;padding:12px 12px 5px;scroll-snap-type:x mandatory}.photo{min-width:82%;height:225px;border-radius:16px;overflow:hidden;position:relative;background:#e7edf1;scroll-snap-align:center}.photo img{width:100%;height:100%;object-fit:cover}.photoCap{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:white;font-size:10px}.photoSource{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:99px;padding:3px 6px;font-size:8px;text-decoration:none}
.gsection{padding:14px 15px;border-top:1px solid var(--line)}.gsection:first-of-type{border-top:0}.gtitle{font-size:10px;color:#8797a1;font-weight:900;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}.gtext{font-size:14px;line-height:1.8;color:#304754;margin:0}.hist{display:grid;grid-template-columns:68px 1fr;gap:5px 10px;margin:7px 0}.hyear{font-size:11px;font-weight:950;color:#2f5469}.htext{font-size:13px;line-height:1.65;color:#405966}.step{display:grid;grid-template-columns:26px 1fr;gap:9px;padding:8px 0}.step+.step{border-top:1px dashed #edf1f3}.stepNo{width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#182f3d;color:#fff;font-size:10px;font-weight:950}.step b{font-size:13px}.step p{font-size:12px;line-height:1.6;color:#647782;margin:2px 0 0}.shot{background:#f6f8fa;border-radius:12px;padding:9px 10px;margin:6px 0}.shot b{font-size:11px}.shot p{font-size:12px;color:#647782;margin:3px 0 0;line-height:1.55}.note{font-size:12px;line-height:1.65;color:#5f7480;padding:7px 0}.sources a{display:block;font-size:10px;color:#5f86a0;padding:4px 0;text-decoration:none}.guideActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 15px 13px}
.guideAppBtn{border:0;border-radius:13px;padding:10px;font-weight:900;display:block;text-align:center;text-decoration:none}
.guideAppBtn.amap{background:#162f3e;color:#fff}
.guideAppBtn.xhs{background:#f2f4f6;color:#2c3f4b}
.miniRoute{display:grid;gap:6px}.mini{display:grid;grid-template-columns:24px 1fr;gap:8px;background:#f6f8fa;border-radius:12px;padding:8px}.mini b{font-size:12px}.mini span{font-size:11px;color:#657986;display:block;margin-top:2px}
.gInfo{display:grid;gap:6px;padding:10px 15px 0}
.gInfoRow{display:grid;grid-template-columns:62px 1fr;gap:8px;background:#f6f8fa;border-radius:12px;padding:8px 10px}
.gInfoK{font-size:10px;font-weight:950;color:#2f5469;padding-top:1px}
.gInfoV{font-size:11px;line-height:1.55;color:#405966}
.trans{margin:8px 10px 0}
.tTitle{font-size:10px;color:#8797a1;font-weight:900;margin:2px 2px 6px;letter-spacing:.06em}
.tleg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:7px}
.tpair{display:flex;align-items:center;gap:6px;font-size:11px;color:#5f7480}
.tfrom{font-weight:900;color:#2f5469;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tarrow{color:#c3cdd3;font-weight:900}
.tto{font-weight:900;color:#2f5469;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkm{margin-left:auto;font-size:9px;color:#a0abb2;white-space:nowrap}
.tchips{display:flex;gap:6px;margin-top:7px}
.tchip{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px 5px;font-size:10px;font-weight:900;color:#5b7180;line-height:1.2;position:relative}
.tchip i{display:block;font-style:normal;font-size:8px;color:#a0abb2;font-weight:700;margin-top:1px}
.tchip.on{background:#152b38;color:#fff;border-color:#152b38}
.tchip.on i{color:#9fc0d2}
.tchip.dim{opacity:.32;pointer-events:none}
.tchip.rec:after{content:"荐";position:absolute;top:-5px;right:-3px;background:var(--s);color:#fff;font-size:7px;border-radius:99px;padding:1px 4px;font-weight:950}
.tchip.rec.on:after{display:none}
.tSub{margin-top:6px;font-size:9px;color:#98a5ad;line-height:1.4}
.customSec{margin:14px 10px 0}
.customHead{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.customHead>span{font-size:10px;color:#8797a1;font-weight:900;letter-spacing:.06em}
.cAddBtn{border:0;background:#152b38;color:#fff;font-size:11px;font-weight:950;padding:7px 13px;border-radius:999px}
.customList{display:grid;gap:7px}
.crow{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 6px}
.crow.dragging{opacity:.45;border-style:dashed}
.chandle{color:#c3cdd3;font-weight:950;font-size:16px;padding:8px 2px;cursor:grab;touch-action:none;text-align:center}
.cTime{font-size:10px;font-weight:950;color:#2f5469}
.cTitle{font-size:13px;font-weight:850;margin-top:1px;line-height:1.3}
.cPlace{font-size:10px;color:#7d8e98;margin-top:2px}
.cNote{font-size:10px;color:#a0abb2;margin-top:2px;line-height:1.4}
.cActions{display:flex;flex-direction:column;gap:5px}
.cNav,.cEdit{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#5b7180;display:grid;place-items:center;text-decoration:none;font-size:12px}
.cEmpty{font-size:11px;color:#98a5ad;text-align:center;padding:14px 0;border:1px dashed var(--line);border-radius:14px;background:#fff}
.cOverlay{position:fixed;inset:0;background:rgba(9,18,24,.35);z-index:3000;display:none;align-items:center;justify-content:center;padding:24px}
.cOverlay.open{display:flex}
.cModal{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.cModalHead{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:950;margin-bottom:10px}
.cForm label{display:block;font-size:10px;font-weight:950;color:#8797a1;margin:9px 0 3px}
.cForm input,.cForm textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 10px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.cForm textarea{resize:vertical}
.cModalActions{display:flex;align-items:center;gap:8px;margin-top:16px}
.cDel{border:1px solid #f0c9c7;background:#fff;color:#d9534f;border-radius:11px;padding:9px 14px;font-size:12px;font-weight:900}
.cSave{flex:1;border:0;background:#152b38;color:#fff;border-radius:11px;padding:11px;font-size:13px;font-weight:950}
@media(min-width:700px){.cover{height:230px}.routePreview img{max-height:360px;object-fit:cover}.photo{min-width:65%;height:300px}.guide{left:50%;transform:translateX(-50%);width:680px;bottom:14px;border-radius:25px;max-height:88vh}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="days" id="days"><div class="filters"><button class="fbtn" data-filter="all">全</button><button class="fbtn on" data-filter="ab">S+A</button><button class="fbtn" data-filter="s">S</button></div></div></div>
  <div class="cover"><img id="coverImg" alt=""><div class="coverInfo"><span class="coverDate" id="coverDate"></span><a class="sourceLink" id="coverSource" target="_blank">图源 ↗</a></div></div>
  <div class="arrival" id="arrival"></div>
  <div class="routePreview"><img id="routePreviewImg" alt="路线预览"></div>
  <div class="summary" id="summary"></div>
  <div class="legend"><i style="background:var(--s)"></i>S <i style="background:var(--a)"></i>A <i style="background:var(--b)"></i>B <i style="background:var(--lock)"></i>固定</div>
  <div class="trans" id="transport"></div>
  <div class="timeline" id="timeline"></div>
  <div class="customSec">
    <div class="customHead"><span>自定义行程 · 可拖动排序 / 点✎修改</span><button class="cAddBtn" id="customAdd">＋ 添加</button></div>
    <div class="customList" id="customList"></div>
  </div>
</div>
<div class="cOverlay" id="cOverlay">
  <div class="cModal">
    <div class="cModalHead"><b id="cModalTitle">添加行程</b><button class="close" id="cClose">×</button></div>
    <div class="cForm">
      <label>时间<input id="cTime" placeholder="如 14:00" inputmode="numeric"></label>
      <label>标题<input id="cTitle" placeholder="如 里院喜剧节《欢迎老张》"></label>
      <label>地点（可留空）<input id="cPlace" placeholder="如 乐赏区·意思坊二厅"></label>
      <label>备注（预约 / 注意事项等）<textarea id="cNote" rows="3" placeholder="线上小程序预约、开场前30分钟排队…"></textarea></label>
      <div class="cModalActions"><button class="cDel" id="cDel" style="display:none">删除</button><span style="flex:1"></span><button class="cSave" id="cSave">保存</button></div>
    </div>
  </div>
</div>
<div class="guideOverlay" id="guideOverlay">
  <div class="guide" id="guide">
    <div class="handle"></div>
    <div class="ghead"><h2 id="gName"></h2><div class="gmeta" id="gMeta"></div><button class="close" id="gClose">×</button></div>
    <div id="gInfo"></div>
    <div id="gGallery"></div>
    <div class="guideActions">
      <a class="guideAppBtn amap" id="guideNav" target="_blank" rel="noopener">高德</a>
      <a class="guideAppBtn xhs" id="guideXhs" target="_blank" rel="noopener">小红书</a>
    </div>
    <div id="gBody"></div>
  </div>
</div>
<script>
const GUIDES={"栈桥": {"meta": "A · 25分钟 · 1892 → 1930s → 城市名片", "gallery": [{"src": "assets/img/青岛太平路栈桥航拍.jpg", "caption": "经典俯瞰：看栈桥如何从老城伸入青岛湾", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%A4%AA%E5%B9%B3%E8%B7%AF%E6%A0%88%E6%A1%A5%E8%88%AA%E6%8B%8D.jpg"}, {"src": "assets/img/青岛栈桥回澜阁.jpg", "caption": "回澜阁近景：栈桥最经典的终点画面", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E6%A0%88%E6%A1%A5%E5%9B%9E%E6%BE%9C%E9%98%81.jpg"}, {"src": "assets/img/青岛栈桥回澜阁老明信片.jpg", "caption": "1930年代明信片：回澜阁成为城市名片后的形象", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E6%A0%88%E6%A1%A5%E5%9B%9E%E6%BE%9C%E9%98%81%E8%80%81%E6%98%8E%E4%BF%A1%E7%89%87.jpg"}, {"src": "assets/img/青岛栈桥回澜阁夜景.jpg", "caption": "夜景：回澜阁与海面灯光", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E6%A0%88%E6%A1%A5%E5%9B%9E%E6%BE%9C%E9%98%81%E5%A4%9C%E6%99%AF.jpg"}], "quick": "把栈桥当成青岛近代城市的一条“时间轴”来看：它最初不是旅游景点，而是1892年为军事与物资运输建设的码头。德国占领后继续加长、铺设轻便铁轨，承担港口功能；到1930年代，城市政府重修改造并在尽端建回澜阁，功能从港口设施转向公共滨海空间与城市形象。你今天看到的“海上长桥＋八角阁”其实是青岛从港口城市走向旅游城市的缩影。", "history": [["1892", "清政府在胶澳设防时期修建前海栈桥，最初约200米，是军需、货运码头。"], ["1897后", "德国占领胶澳后继续扩建栈桥，曾铺设轻便铁轨，和港口运输体系相连。"], ["1931–1933", "青岛市政府重修、加长并增建回澜阁。此后“飞阁回澜”成为老青岛最稳定的城市图像之一。"], ["今天", "栈桥的价值不只在“海上走一段”，而在于它把老城中山路轴线、青岛湾和近代港口史压缩在一个视野里。"]], "steps": [["1", "从太平路陆侧先看全桥", "别急着上桥。先站在陆侧看“道路→桥→回澜阁→海”的轴线，这是最能理解城市关系的角度。"], ["2", "走桥中段回头看老城", "回头找圣弥厄尔教堂双塔、沿岸旧建筑和青岛站方向，理解栈桥不是孤立景点，而是老城的海上延伸。"], ["3", "到回澜阁前看建筑细部", "注意八角平面、双层飞檐和“回澜阁”匾额。它是1930年代改造后加入的中国传统式视觉符号。"], ["4", "时间够再绕阁一圈", "不同侧面分别对应小青岛、老城和开放海面；25分钟内完成完全够。"]], "shots": [["经典正片", "陆侧/太平路靠海一侧，用长焦或2×把栈桥、回澜阁压缩在海面上。"], ["回看老城", "走到桥中后回头，把桥面人流做前景、红瓦老城做背景。"], ["历史对照", "详情图库里看1930年代明信片，再站在今天相近方向对比。"]], "notes": ["如果人非常多，不必一定走到最尽头；陆侧全景比挤在桥头更容易拍。", "海风大时把它压缩到15分钟也不影响理解。"], "sources": [["青岛市政府·栈桥介绍", "https://www.qingdao.gov.cn/yfqd/qdwl/cjfw/wyqhb/202009/t20200902_518755.shtml"], ["Wikimedia Commons·回澜阁", "https://commons.wikimedia.org/wiki/Category:Huilan_Pavilion"]], "hours": "全天开放（海上栈桥）", "ticket": "免费"}, "圣弥厄尔大教堂": {"meta": "A · 25分钟 · 1932–1934", "gallery": [{"src": "assets/img/20240730-St-Michael-s-Cathedral-Qingdao-01.jpg", "caption": "正立面：双塔与中央玫瑰窗", "source": "https://commons.wikimedia.org/wiki/File:20240730%20St.%20Michael%27s%20Cathedral%2C%20Qingdao%2001.jpg"}, {"src": "assets/img/20240730-St-Michael-s-Cathedral-Qingdao-02.jpg", "caption": "纵向角度：强调56米双塔", "source": "https://commons.wikimedia.org/wiki/File:20240730%20St.%20Michael%27s%20Cathedral%2C%20Qingdao%2002.jpg"}, {"src": "assets/img/20151213-St-Michael-s-Cathedral-Qingdao-01.jpg", "caption": "街巷视角：教堂与老城尺度", "source": "https://commons.wikimedia.org/wiki/File:20151213%20St.%20Michael%27s%20Cathedral%2C%20Qingdao%2001.jpg"}], "quick": "这是青岛老城最醒目的垂直地标之一，建于1932—1934年。它出现得比德占青岛时期晚，因此不要把它简单理解成“德国殖民时期原建的教堂”。更准确的看法是：它位于德国规划奠定的老城空间中，由天主教会在20世纪30年代完成，是青岛近代多层历史叠加的结果。两座约56米高的塔楼让它在坡地街巷里不断被看见。", "history": [["19世纪末–20世纪初", "青岛近代城市建设启动，宗教机构与学校、医院等公共建筑逐步进入城市。"], ["1932", "现教堂开始建设。"], ["1934", "教堂建成，双塔和中央玫瑰窗形成今天的正立面。"], ["2006", "作为青岛近代建筑体系的重要组成部分，纳入全国重点文物保护单位“青岛德国建筑群”的保护范围。"]], "steps": [["1", "浙江路坡下看完整双塔", "先离建筑稍远，利用坡道拍出双塔高度；贴太近会失去整体比例。"], ["2", "正立面看三段式构图", "中间入口、玫瑰窗与两侧塔楼形成强对称。注意花岗岩材料带来的厚重感。"], ["3", "绕侧面看体量", "正面像“图标”，侧面更容易理解十字形教堂的纵深。"], ["4", "开放且你愿意再进室内", "重点看高挑空间、拱券、彩窗与宗教绘画；你时间紧，外部已经足够。"]], "shots": [["经典机位", "浙江路下坡方向，以街道和行人作尺度，双塔居中。"], ["压缩机位", "向后退，用2×/3×长焦让两塔更有压迫感。"], ["街巷框景", "从周边窄街转角用建筑或树枝做前景，拍“老城里突然冒出的双塔”。"]], "notes": ["建筑风格标签在不同资料中有“罗马复兴”“哥特式语汇”等表述。现场别纠结单一标签，重点看罗马式厚重体量、尖塔与哥特式垂直感如何混合。"], "sources": [["青岛市政府·天主教堂", "https://www.qingdao.gov.cn/yfqd/qdwl/cjfw/wyqtsjd/202009/t20200910_521996.shtml"], ["Wikimedia Commons", "https://commons.wikimedia.org/wiki/Category:St._Michael%27s_Cathedral,_Qingdao"]], "hours": "周二至周六 08:30–18:00；周日 10:00–17:00；周一闭馆（弥撒时段可能限入）", "ticket": "入内约10元；外部广场免费"}, "信号山": {"meta": "S · 45分钟 · 老城总览", "gallery": [{"src": "assets/img/20240729-Qingdao-Signal-Hill.jpg", "caption": "从老城方向看信号山", "source": "https://commons.wikimedia.org/wiki/File:20240729%20Qingdao%20Signal%20Hill.jpg"}, {"src": "assets/img/信號山-信号山-Signal-Hill-HDR-青島-青岛-Qingdao-中國旅遊-中国旅游-China-Touris.jpg", "caption": "山顶红色观景楼与城市天际线", "source": "https://commons.wikimedia.org/wiki/File:%E4%BF%A1%E8%99%9F%E5%B1%B1%20%E4%BF%A1%E5%8F%B7%E5%B1%B1%20Signal%20Hill%20%28HDR%29%20%E9%9D%92%E5%B3%B6%20%E9%9D%92%E5%B2%9B%20Qingdao%20%E4%B8%AD%E5%9C%8B%E6%97%85%E9%81%8A%20%E4%B8%AD%E5%9B%BD%E6%97%85%E6%B8%B8%20China%20Tourism%20SML.20121013.G12.00880-00881-00882.HDR.ChinaTourism.CN.Qingdao.SignalHill%20%288324917026%29.jpg"}, {"src": "assets/img/从小鱼山看信号山.jpg", "caption": "远看信号山：理解两座观景山的位置关系", "source": "https://commons.wikimedia.org/wiki/File:%E4%BB%8E%E5%B0%8F%E9%B1%BC%E5%B1%B1%E7%9C%8B%E4%BF%A1%E5%8F%B7%E5%B1%B1.jpg"}], "quick": "信号山的价值不是“又爬一座山”，而是让你在第一天迅速读懂青岛老城。海拔不到百米，但因为位于老城核心，它能把总督楼、教堂、青岛湾、红瓦屋顶和坡地街道放在同一个视野里。它的名字也来自真实功能：近代这里曾设置为船舶进出港服务的信号设施，通过旗帜、气象和风力信息向海上发出信号。", "history": [["德占时期", "山头被纳入殖民城市的军事与通信系统，曾有信号旗台、无线电台等设施，也出现过德文山名。"], ["港口功能", "每日悬挂气象、风力等标志，为船舶进出港提供信息，因此“信号山”这一功能性名称最终保留下来。"], ["1920年代以后", "中国收回青岛后，山名逐步固定为信号山。"], ["1984以后", "辟为公园；山顶红色观景楼成为今天最显眼的识别物。"]], "steps": [["1", "上山先找青岛湾", "先确定海的方向，再回看城市，不容易被建筑群弄乱。"], ["2", "找圣弥厄尔双塔", "双塔是老城最好的定位器；你刚刚走过它，这时会立刻建立空间记忆。"], ["3", "找总督楼及红瓦屋顶", "观察建筑如何顺着坡地错落，而不是规则平铺。"], ["4", "最后看山海边界", "青岛老城真正好看的不是单栋建筑，而是“坡地＋建筑＋海”的连续景观。"]], "shots": [["经典全景", "观景平台朝老城与青岛湾方向，尽量用1×或0.8×保留红瓦与海。"], ["红顶机位", "把山顶红色观景楼作为前景，城市作背景。"], ["城市纹理", "2×拍教堂、屋顶、树冠的层层叠叠，比纯大广角更有青岛味。"]], "notes": ["你只需45分钟。不要为了每个平台都走一遍而拖时间；能看到教堂＋海＋红瓦就完成任务。"], "sources": [["青岛市政府·信号山", "https://www.qingdao.gov.cn/yfqd/qdwl/cjfw/wyqgy/202009/t20200903_520367.shtml"], ["Wikimedia Commons", "https://commons.wikimedia.org/wiki/Category:Qingdao_Signal_Hill"]], "hours": "旺季(4–10月) 06:00–20:30；淡季 06:00–20:00", "ticket": "公园免费；旋转观景楼10元（学生半价）"}, "劈柴院": {"meta": "A · 15–20分钟 · 1902起", "gallery": [{"src": "assets/img/劈柴院中山路入口20240310.jpg", "caption": "中山路入口：最直观的“进入老街”画面", "source": "https://commons.wikimedia.org/wiki/File:%E5%8A%88%E6%9F%B4%E9%99%A2%E4%B8%AD%E5%B1%B1%E8%B7%AF%E5%85%A5%E5%8F%A320240310.jpg"}, {"src": "assets/img/劈柴院内部2024031001.jpg", "caption": "内部窄巷：看里院商业街的尺度", "source": "https://commons.wikimedia.org/wiki/File:%E5%8A%88%E6%9F%B4%E9%99%A2%E5%86%85%E9%83%A82024031001.jpg"}, {"src": "assets/img/劈柴院-江宁会馆.jpg", "caption": "江宁会馆：劈柴院的戏曲与市民娱乐记忆", "source": "https://commons.wikimedia.org/wiki/File:%E5%8A%88%E6%9F%B4%E9%99%A2%E2%80%94%E2%80%94%E6%B1%9F%E5%AE%81%E4%BC%9A%E9%A6%86.jpg"}, {"src": "assets/img/青岛劈柴院历史街道布局.jpg", "caption": "历史街道布局：理解“人”字形巷道", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%8A%88%E6%9F%B4%E9%99%A2%E5%8E%86%E5%8F%B2%E8%A1%97%E9%81%93%E5%B8%83%E5%B1%80.jpg"}], "quick": "劈柴院不是一座单独的院子，更像一段由窄巷、里院、商铺和会馆共同组成的市井娱乐街区。1902年前后，江宁路在近代城市建设中形成；到20世纪20年代，这里逐渐聚集饭馆、茶社、旅馆、说书、戏曲、曲艺等业态，成为普通市民消费和娱乐最密集的地方之一。你今晚去里院喜剧节前经过它，正好能把今天的喜剧演出放进“百年前这里就靠表演和烟火气聚人”的历史里。", "history": [["1902前后", "江宁路形成，周边开始建设里院与商业设施。"], ["1920s以后", "饭馆、茶社、旅店、说书、戏曲、曲艺等高度集中，劈柴院成为典型市民娱乐区。"], ["空间特征", "狭窄街巷呈分叉形态，两侧多为商住混合的里院建筑；街道尺度很小，却能容纳高密度商业。"], ["今天", "经过修缮和业态更新，传统餐饮与文旅消费叠加，最值得看的仍是窄巷尺度、院落入口和江宁会馆。"]], "steps": [["1", "从中山路入口进入", "先看入口如何从较宽的中山路突然收窄到内部巷道。"], ["2", "沿主巷走，不追每家小吃", "看楼上连廊、窄巷、招牌和人群，15分钟足够。"], ["3", "到江宁会馆看戏台记忆", "会馆是这里“吃饭＋看戏＋社交”传统最直接的空间证据。"], ["4", "从北京路侧离开", "正好衔接你今晚的里院喜剧节乐赏区。"]], "shots": [["灯笼窄巷", "站在主巷中轴拍纵深，让红灯笼/招牌形成顶部框架。"], ["入口对比", "中山路入口向内拍，突出宽街到窄巷的尺度突变。"], ["江宁会馆", "拍门头或戏台，不必为了空镜等太久，人群本身就是劈柴院的内容。"]], "notes": ["它值得“穿过去”，不值得单独耗1小时。你的最佳用法就是演出前15–20分钟顺路看。"], "sources": [["青岛老城4A景区", "https://www.qingdao.gov.cn/ywdt/bmdt/202601/t20260116_10472350.shtml"], ["Wikimedia Commons·劈柴院", "https://commons.wikimedia.org/wiki/Category:Pichaiyuan,_Qingdao"]], "hours": "全天开放", "ticket": "免费街区"}, "里院怎么读": {"meta": "里院总导览 · 到任何一座院子都能用", "gallery": [{"src": "assets/img/青岛大鲍岛-广兴里.jpg", "caption": "广兴里外部：街道立面", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%A4%A7%E9%B2%8D%E5%B2%9B%E2%80%94%E2%80%94%E5%B9%BF%E5%85%B4%E9%87%8C.jpg"}, {"src": "assets/img/青岛广兴里内院-2022-02-06.jpg", "caption": "内院：最直观理解“外楼内院”", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E5%86%85%E9%99%A2%202022-02-06.jpg"}, {"src": "assets/img/青岛广兴里南侧内廊.jpg", "caption": "连廊：里院生活的核心空间", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E5%8D%97%E4%BE%A7%E5%86%85%E5%BB%8A.jpg"}, {"src": "assets/img/青岛广兴里俯瞰.jpg", "caption": "俯瞰：闭合院落格局", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E4%BF%AF%E7%9E%B0.jpg"}, {"src": "assets/img/青岛广兴里早期建筑后院旧影.jpg", "caption": "历史旧影：和今天修复后的院落对照", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E6%97%A9%E6%9C%9F%E5%BB%BA%E7%AD%91%E5%90%8E%E9%99%A2%E6%97%A7%E5%BD%B1.jpg"}], "quick": "里院是青岛最值得真正“看懂”的本土建筑类型。20世纪初，大鲍岛华人商业与居住人口迅速增长，传统四合院已无法满足高密度城市生活，于是形成一种“西式多层楼房骨架＋中国院落生活”的华洋折中形态。最典型的逻辑是：临街一层做商铺，上层和院内居住；建筑围成“口、日、目、凸”等院落，内部用楼梯、连廊连接。它既不是北京四合院，也不是上海石库门，而是青岛在特定城市制度、商业发展和人口密度下长出的本土答案。", "history": [["1898以后", "德国租借胶澳，大鲍岛被划作华人居住、商贸和社会交往的重要区域。"], ["20世纪初", "人口、商业快速增长，出现多层商住混合、内向院落的“里院”类型。"], ["1930年代", "里院数量达到数百处，成为青岛普通市民生活和华商商业网络的重要空间。"], ["典型生活", "临街商铺、楼上住家；院里共用水龙头、厕所、楼梯和连廊。住户彼此高度熟悉，商业与家庭生活几乎没有明确边界。"], ["1990年代以后", "部分里院因设施老化、居住条件下降而衰败；近年通过“修旧如旧、最小干预”重新活化。"]], "steps": [["1", "先站在街外看立面", "看起来常像普通西式多层商业楼，这是里院的“城市外壳”。"], ["2", "穿门洞进入天井", "空间会突然从街道变成内院，这是最关键的一次转换。"], ["3", "抬头看连廊与楼梯", "理解过去居民如何在多层院落中共享交通和公共空间。"], ["4", "再回头看首层商铺", "把“下铺上居 / 前铺后居”与今天的新店铺对应起来。"], ["5", "最后看修复痕迹", "辨认旧砖、木构、门窗和新增设施。好的更新不是把一切做旧，而是让新旧可辨。"]], "shots": [["门洞框院", "站在入口内侧，用门洞框住天井和对面回廊。"], ["仰拍回廊", "0.5×从院中心向上拍，最容易表现“几层楼围一方天”。"], ["生活细节", "不要只拍建筑全景；旧砖、木扶手、门牌、商铺门头更能体现里院的层叠时间。"]], "notes": ["大鲍岛今天的漂亮不等于“原汁原味保存”。它是历史建筑修缮后重新装入当代商业、展览和文旅内容的活化街区。把这种新旧叠加本身也当成城市更新的一部分看。"], "sources": [["青岛市政府·何以里院", "https://www.qingdao.gov.cn/ywdt/bmdt/202511/t20251117_10368597.shtml"], ["青岛市政府·大鲍岛前世今生", "https://www.qingdao.gov.cn/ywdt/qsdt/202205/t20220506_6036629.shtml"]], "hours": "全天开放（老城街区）", "ticket": "免费"}, "小鱼山": {"meta": "A · 40分钟 · 更靠海的老城视角", "gallery": [{"src": "assets/img/20240729-View-around-Xiaoyushan-Qingdao.jpg", "caption": "山顶视角：汇泉湾、红瓦与海", "source": "https://commons.wikimedia.org/wiki/File:20240729%20View%20around%20Xiaoyushan%2C%20Qingdao.jpg"}, {"src": "assets/img/小鱼山公园-览潮阁.jpg", "caption": "览潮阁：山顶最醒目的建筑", "source": "https://commons.wikimedia.org/wiki/File:%E5%B0%8F%E9%B1%BC%E5%B1%B1%E5%85%AC%E5%9B%AD%E2%80%94%E2%80%94%E8%A7%88%E6%BD%AE%E9%98%81.jpg"}, {"src": "assets/img/小鱼山公园-碧波亭.jpg", "caption": "碧波亭：传统园林构图", "source": "https://commons.wikimedia.org/wiki/File:%E5%B0%8F%E9%B1%BC%E5%B1%B1%E5%85%AC%E5%9B%AD%E2%80%94%E2%80%94%E7%A2%A7%E6%B3%A2%E4%BA%AD.jpg"}, {"src": "assets/img/小鱼山公园-览潮阁2层.jpg", "caption": "览潮阁二层：适合快速扫一圈城市", "source": "https://commons.wikimedia.org/wiki/File:%E5%B0%8F%E9%B1%BC%E5%B1%B1%E5%85%AC%E5%9B%AD%E2%80%94%E2%80%94%E8%A7%88%E6%BD%AE%E9%98%812%E5%B1%82.jpg"}], "quick": "如果信号山是“看老城屋顶”，小鱼山就是“看老城如何贴着汇泉湾展开”。它海拔不高，重点不是爬山，而是快速获得第一海水浴场、鲁迅公园、鱼山路一带和红瓦建筑的综合视野。公园1985年建成，以览潮阁为中心，建筑采用传统民族风格，是改革开放后青岛重新塑造城市旅游景观的一部分。", "history": [["名字来源", "山体原本没有固定的“小鱼山”名，周边道路称鱼山路后，山名逐渐固定。"], ["1985", "小鱼山公园建成开放，以览潮阁、碧波亭、拥翠亭等形成传统园林式观景体系。"], ["今天", "它最有价值的是位置：老城、汇泉湾和海滨公园在这里被压缩到同一个视野。"]], "steps": [["1", "直接上览潮阁附近", "不要在山脚慢磨，目标是山顶视野。"], ["2", "先看第一海水浴场", "海湾弧线最清楚，是小鱼山与信号山最大的视觉差异。"], ["3", "转向老城屋顶", "寻找教堂、红瓦建筑和树冠。"], ["4", "40分钟准时撤", "之后大学路更适合慢走，不需要把时间都花在山上。"]], "shots": [["汇泉湾全景", "广角把沙滩弧线、海和红瓦都收入画面。"], ["阁楼框景", "利用览潮阁门窗、栏杆做前景，不要只拍空中全景。"], ["红瓦＋海", "2×压缩屋顶与海平面，画面会比0.5×更有层次。"]], "sources": [["Wikimedia Commons·小鱼山", "https://commons.wikimedia.org/wiki/Category:Xiaoyushan_Hill,_Qingdao"]], "hours": "旺季(4–10月) 06:00–20:00（19:30停止入园）", "ticket": "免费"}, "大学路 / 黄县路": {"meta": "A · 60分钟 · 老城文化街区", "gallery": [], "quick": "大学路—黄县路一带适合当作“从观景台回到地面”的一段。这里不是靠某一栋超级地标取胜，而是靠坡道、院墙、树荫、旧住宅和文化机构形成连续街景。相比中山路的商业轴线，它更安静，更接近青岛老城区的文化教育与居住气质。", "history": [["近代老城", "鱼山路、大学路一带逐步形成学校、文化机构、住宅和公共建筑混合的街区。"], ["城市气质", "青岛的坡地道路让街角经常出现“突然看见海/屋顶/山”的框景，这也是这里比单个网红墙更值得走的原因。"], ["今天", "咖啡、文创和游客进入后，街区更商业化，但道路尺度和建筑关系仍然是核心看点。"]], "steps": [["1", "从小鱼山下山后直接进入街区", "不需要专门打车。"], ["2", "大学路看长街与树荫", "不用排队拍网红墙，随走随拍。"], ["3", "黄县路看更小尺度的住宅街", "注意墙体、院门和坡度。"], ["4", "60分钟结束", "午饭后直接打车去八大关，避免上午citywalk超过3小时。"]], "shots": [["坡道纵深", "站在坡顶/坡底拍街道高差。"], ["转角框景", "用院墙、路牌、树干做前景，比正面摆拍更自然。"]], "sources": [["青岛老城文化旅游区", "https://www.qingdao.gov.cn/ywdt/bmdt/202601/t20260116_10472350.shtml"]], "hours": "全天开放（街区）", "ticket": "免费"}, "花石楼": {"meta": "S · 30分钟 · 八大关建筑锚点", "gallery": [{"src": "assets/img/花石楼.jpg", "caption": "经典正面：花岗岩外墙与塔楼", "source": "https://commons.wikimedia.org/wiki/File:%E8%8A%B1%E7%9F%B3%E6%A5%BC.jpg"}, {"src": "assets/img/青岛八大关花石楼.jpg", "caption": "斜侧面：更能看出城堡式体量", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%85%AB%E5%A4%A7%E5%85%B3%E8%8A%B1%E7%9F%B3%E6%A5%BC.jpg"}, {"src": "assets/img/花石楼内部.jpg", "caption": "内部：从外部“城堡”切换到别墅尺度", "source": "https://commons.wikimedia.org/wiki/File:%E8%8A%B1%E7%9F%B3%E6%A5%BC%E5%86%85%E9%83%A8.jpg"}, {"src": "assets/img/第二浴场海滩上眺望花石楼-路人---panoramio.jpg", "caption": "从第二海水浴场回看：建筑与海岸同框", "source": "https://commons.wikimedia.org/wiki/File:%E7%AC%AC%E4%BA%8C%E6%B5%B4%E5%9C%BA%E6%B5%B7%E6%BB%A9%E4%B8%8A%E7%9C%BA%E6%9C%9B%E8%8A%B1%E7%9F%B3%E6%A5%BC%EF%BC%88%E8%B7%AF%E4%BA%BA%EF%BC%89%20-%20panoramio.jpg"}], "quick": "花石楼是你八大关最值得锁定的一栋建筑，但它代表的并不是“整个八大关都是德国殖民建筑”。八大关的大规模别墅建设主要发生在1929以后、尤其1930年代。花石楼官方常见叙述为1930年设计、1931年落成，由中国建筑师刘耀辰、王云飞设计，使用花岗岩和滑石装饰，体量混合罗马式、哥特式与欧洲城堡意象。它能帮你理解八大关真正的特点：不是一种统一风格，而是民国时期多元建筑语言的集中实验场。", "history": [["1929", "青岛市政府把汇泉湾东侧一带划为“特别规定建筑地”，鼓励建设低密度别墅。"], ["1930–1931", "官方文旅资料通常记载花石楼在此阶段设计、建成。"], ["建筑语言", "粗粝石墙、塔楼、拱窗、坡屋顶共同制造欧洲城堡感，但并非纯粹复制某一国风格。"], ["史料提醒", "关于花石楼确切建造年份和早期业主，地方研究存在不同说法。游客常听到的某些“俄国贵族别墅”传说不能全部当成确定史实。"], ["1980s后", "“花石楼”这一名称逐渐普及，今天成为八大关最强的视觉地标之一。"]], "steps": [["1", "先在外部斜45°看整体", "最容易同时看到塔楼、石墙、坡顶。"], ["2", "贴近看石材与窗洞", "名字里的“花石”感来自材料和表面处理，不只是装饰。"], ["3", "如果排队短再进室内", "你时间紧，内部不是必需；外观已经能读懂建筑。"], ["4", "最后去第二海水浴场回看", "从沙滩方向把花石楼和海岸放在一起，这是它最经典的环境关系。"]], "shots": [["经典建筑照", "入口外斜侧角度，不要正贴立面；留树冠做边框。"], ["海滩回望", "第二海水浴场向花石楼方向拍，海岸和建筑同框。"], ["石墙细节", "拍粗糙花岗岩、窗洞、塔楼局部，作为组图补充。"]], "sources": [["青岛市政府·八大关相关资料", "https://www.qingdao.gov.cn/lslm/zt/whyc/wwzl/202112/t20211201_3895722.shtml"], ["Wikimedia Commons·花石楼", "https://commons.wikimedia.org/wiki/Category:Hua_Shi_Lou"]], "hours": "4–6月/9–11月 08:30–17:30（17:00停止入馆）；7–8月 08:30–18:30", "ticket": "8.5元（1.4米以下免票）"}, "公主楼": {"meta": "A · 八大关观光车顺看 · 10分钟", "gallery": [], "quick": "公主楼最容易被“童话故事”带跑。它今天被叫作公主楼，和1930年代丹麦王室成员访问青岛及后来流传的浪漫故事有关，但“专门为某位丹麦公主建、且公主长期居住于此”并不是可以毫无保留当事实讲的结论。建筑本身更值得看：绿色墙面、陡坡屋顶、尖拱和童话式体量，让它在八大关众多别墅里极容易识别。", "history": [["1930年代–1940年代", "不同公开资料对具体建造年份存在差异；青岛官方近年的城市介绍多把其现状形成放在这一时期。"], ["建筑特征", "绿墙、坡屋顶、尖拱、塔楼式体量，带明显北欧/哥特复兴式想象。"], ["名称故事", "“公主楼”并非最初正式名称，后来因丹麦王室访问青岛的故事与旅游传播逐渐固定。"]], "steps": [["1", "观光车在公主楼附近下/停", "先看整体，不要急着进。"], ["2", "找到绿色立面和白色窗框", "这是最易识别的视觉语言。"], ["3", "把故事当“城市传说”听", "记住：好听的旅游故事和严格史实不是一回事。"]], "shots": [["经典正面", "树木之间拍绿墙、尖顶和白色窗框，最好保留一点道路做前景。"]], "sources": [["八大关伴游（2026）", "https://www.qingdao.gov.cn/ywdt/bmdt/202609/t20260904_10722423.shtml"]], "hours": "08:00–17:30（17:00停止入园）", "ticket": "单馆20元；公主楼+蝴蝶楼+西班牙风情馆联票50元（学生半价）"}, "八大关伴游": {"meta": "A · 约45分钟 · 2026新观光车", "gallery": [{"src": "assets/img/花石楼.jpg", "caption": "经典正面：花岗岩外墙与塔楼", "source": "https://commons.wikimedia.org/wiki/File:%E8%8A%B1%E7%9F%B3%E6%A5%BC.jpg"}, {"src": "assets/img/青岛八大关花石楼.jpg", "caption": "斜侧面：更能看出城堡式体量", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%85%AB%E5%A4%A7%E5%85%B3%E8%8A%B1%E7%9F%B3%E6%A5%BC.jpg"}, {"src": "assets/img/花石楼内部.jpg", "caption": "内部：从外部“城堡”切换到别墅尺度", "source": "https://commons.wikimedia.org/wiki/File:%E8%8A%B1%E7%9F%B3%E6%A5%BC%E5%86%85%E9%83%A8.jpg"}, {"src": "assets/img/第二浴场海滩上眺望花石楼-路人---panoramio.jpg", "caption": "从第二海水浴场回看：建筑与海岸同框", "source": "https://commons.wikimedia.org/wiki/File:%E7%AC%AC%E4%BA%8C%E6%B5%B4%E5%9C%BA%E6%B5%B7%E6%BB%A9%E4%B8%8A%E7%9C%BA%E6%9C%9B%E8%8A%B1%E7%9F%B3%E6%A5%BC%EF%BC%88%E8%B7%AF%E4%BA%BA%EF%BC%89%20-%20panoramio.jpg"}], "quick": "八大关不是“一栋栋打卡”的集合，而是20世纪30年代逐步形成的低密度别墅区。1929年青岛市政府把这里划为特别规划建设区域，1930年前后开始系统开发，随后形成以关隘命名的道路和大量风格各异的住宅。你不想长走，2026年新开的“八大关伴游”电动观光车正好适合：用车串核心建筑，把步行留给花石楼和第二海水浴场。", "history": [["1929", "市政府在汇泉湾东部规划低密度住宅与别墅建设区域。"], ["1930s", "道路、绿化和别墅集中发展，形成“三纵七横”等街区格局。"], ["建筑多元", "业主、建筑师背景复杂，欧洲多种历史风格与现代设计并存，因此有“万国建筑博览会”的俗称。"], ["2026", "市南区上线八大关伴游：电动观光车串花石楼、宁武关路、公主楼/西班牙风情馆、正阳关一支路、山海关路，再回花石楼。"]], "steps": [["1", "13:00先看花石楼", "30分钟。"], ["2", "13:35搭电动观光车", "官方公布单次20元，支持招手即停；当天以现场运营为准。"], ["3", "公主楼/西班牙风情馆一带快速看", "不必每栋进。"], ["4", "14:20左右回花石楼附近", "步行去第二海水浴场，形成“建筑→海”的收束。"]], "shots": [["车上观察", "不要全程低头。重点看林荫道转角如何不断露出不同别墅。"], ["街道比建筑更重要", "八大关最经典的照片往往是树荫＋道路＋一角别墅，而不是孤立正立面。"]], "sources": [["青岛市政府·八大关伴游 2026", "https://www.qingdao.gov.cn/ywdt/bmdt/202609/t20260904_10722423.shtml"], ["Wikimedia Commons·花石楼", "https://commons.wikimedia.org/wiki/Category:Hua_Shi_Lou"]], "hours": "街区全天开放", "ticket": "街区免费；电动观光车单次约20元（招手即停，以现场为准）"}, "第二海水浴场": {"meta": "S · 35分钟 · 八大关的海岸出口", "gallery": [{"src": "assets/img/20240729-Qingdao-No-2-Beach-01.jpg", "caption": "八大关向海打开的经典视角", "source": "https://commons.wikimedia.org/wiki/File:20240729%20Qingdao%20No.%202%20Beach%2001.jpg"}, {"src": "assets/img/青岛第二海水浴场.jpg", "caption": "沙滩与海岸线", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E7%AC%AC%E4%BA%8C%E6%B5%B7%E6%B0%B4%E6%B5%B4%E5%9C%BA.jpg"}, {"src": "assets/img/Qingdao-Beach-No-2.jpg", "caption": "海滩尺度与八大关滨海关系", "source": "https://commons.wikimedia.org/wiki/File:Qingdao%20Beach%20No.%202.jpg"}], "quick": "第二海水浴场不需要当一个独立“大景点”逛。它最重要的作用是给八大关一个结尾：你刚刚还在林荫路和低密度别墅之间，走几分钟后空间突然完全打开成海。这里也能回看花石楼，从而把“别墅区并不是内陆花园，而是围绕滨海环境形成的高品质居住区”看得很清楚。", "history": [["近代城市发展", "汇泉湾—太平角一带逐步成为青岛重要滨海休闲空间。"], ["八大关形成后", "海水浴场与别墅区共同构成“林荫住宅＋公共海岸”的城市景观。"], ["今天", "它仍是八大关最自然的出口，比单独在街区里兜圈更有完成感。"]], "steps": [["1", "从花石楼一侧下到海边", "第一眼先别拍，先看空间如何打开。"], ["2", "沿沙滩/防波堤走一小段", "控制20分钟。"], ["3", "回头找花石楼", "完成最经典的“建筑＋海岸”同框。"], ["4", "15:10前结束", "之后要休息，为黄昏五四广场留体力。"]], "shots": [["回望花石楼", "沙滩向建筑方向拍，人物可作为尺度。"], ["低机位海岸", "接近水线，用沙滩纹理做前景。"], ["不必追空镜", "这里有人反而更像青岛日常海滨。"]], "sources": [["Wikimedia Commons·第二海水浴场", "https://commons.wikimedia.org/wiki/Category:Qingdao_2nd_Bathing_Beach"]], "hours": "沙滩全天；游泳季(7/1–9/25) 09:00–17:30", "ticket": "入场免费；更衣冲水约10元"}, "五四广场": {"meta": "S · 40分钟 · 17:00到最合适", "gallery": [{"src": "assets/img/20151212-May-Wind.jpg", "caption": "“五月的风”经典近景", "source": "https://commons.wikimedia.org/wiki/File:20151212%20May%20Wind.jpg"}, {"src": "assets/img/May-Fourth-Square-Twilight.jpg", "caption": "黄昏：现代城市天际线开始亮灯", "source": "https://commons.wikimedia.org/wiki/File:May%20Fourth%20Square%20Twilight.jpg"}, {"src": "assets/img/May-4-Square-at-Night---panoramio.jpg", "caption": "夜景：雕塑、海岸与城市灯光", "source": "https://commons.wikimedia.org/wiki/File:May%204%20Square%20at%20Night%20-%20panoramio.jpg"}, {"src": "assets/img/May-Fourth-Square-2025111101.jpg", "caption": "广场空间：看城市中心东移后的尺度", "source": "https://commons.wikimedia.org/wiki/File:May%20Fourth%20Square%202025111101.jpg"}], "quick": "五四广场的名字不是泛泛纪念“五四青年节”，而与青岛的主权问题直接相关。第一次世界大战后，巴黎和会对山东权益问题的处理激起中国社会强烈反应，成为1919年五四运动的重要导火索。今天的广场建于1990年代，属于青岛城市中心向东发展后的新城市空间；因此这里同时连接了“1919的历史记忆”和“1990年代以后现代青岛”的两条时间线。", "history": [["1919", "巴黎和会上有关山东、青岛权益的处置引发全国反对，五四运动爆发。"], ["1990年代", "青岛行政与城市中心向东发展，浮山湾一带形成新的公共城市空间。"], ["1996前后", "五四广场建成，以“五四”命名强化青岛与运动起因之间的历史联系。"], ["“五月的风”", "红色螺旋雕塑以风的旋转、上升形态表现时代力量，成为现代青岛最醒目的城市符号之一。"]], "steps": [["1", "先从城市侧看“五月的风”", "背景是海，能理解广场轴线。"], ["2", "走到海侧回看高层天际线", "这一步最能感受青岛从老城低层坡地到新城高层滨海CBD的尺度变化。"], ["3", "黄昏等灯光亮起", "不用等到特别晚；天还没全黑时层次最好。"], ["4", "17:40左右沿海转奥帆", "不要在广场本身耗太久。"]], "shots": [["黄昏经典", "“五月的风”＋蓝调天空，避免正午硬光。"], ["低角度", "用广场地面或水景做前景，让雕塑显得更有动势。"], ["反向城市照", "转身拍浮山湾高层，记录“新青岛”而不只是红雕塑。"]], "sources": [["Wikimedia Commons·五四广场", "https://commons.wikimedia.org/wiki/Category:May_Fourth_Square"]], "hours": "全天开放", "ticket": "免费"}, "奥帆中心": {"meta": "S · 90分钟（含晚饭） · 夜景", "gallery": [{"src": "assets/img/Fushan-Bay-at-night.jpg", "caption": "浮山湾夜景：最值得留到夜晚的画面", "source": "https://commons.wikimedia.org/wiki/File:Fushan%20Bay%20at%20night.jpg"}, {"src": "assets/img/Qingdao-International-Sailing-Centre-20180508-1.jpg", "caption": "帆船中心港池与设施", "source": "https://commons.wikimedia.org/wiki/File:Qingdao%20International%20Sailing%20Centre%2020180508-1.jpg"}, {"src": "assets/img/青岛奥林匹克帆船中心-情人坝.jpg", "caption": "情人坝：防波堤与海面", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%A5%A5%E6%9E%97%E5%8C%B9%E5%85%8B%E5%B8%86%E8%88%B9%E4%B8%AD%E5%BF%83%E2%80%94%E2%80%94%E6%83%85%E4%BA%BA%E5%9D%9D.jpg"}, {"src": "assets/img/青岛奥林匹克帆船中心-祈福灯塔.jpg", "caption": "灯塔：步行尽端的视觉锚点", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%A5%A5%E6%9E%97%E5%8C%B9%E5%85%8B%E5%B8%86%E8%88%B9%E4%B8%AD%E5%BF%83%E2%80%94%E2%80%94%E7%A5%88%E7%A6%8F%E7%81%AF%E5%A1%94.jpg"}], "quick": "奥帆中心是理解“新青岛”非常直接的一站。这里曾承担2008年北京奥运会和残奥会帆船比赛，是青岛把海洋资源、国际赛事和滨海公共空间结合起来的代表项目。你前两天看的是近代老城、里院和民国别墅，到了这里城市语言突然变成大尺度广场、港池、码头、灯塔和高层天际线。", "history": [["2000s", "为承办2008北京奥运会帆船赛事，燕儿岛一带建设专业帆船比赛与配套设施。"], ["2008", "举办奥运会、残奥会帆船项目。"], ["赛后", "赛事设施转化为公共旅游、帆船运动、城市展示空间，成为青岛“帆船之都”形象的重要载体。"]], "steps": [["1", "从五四广场沿海过来", "中间不必打车，连续的滨海步行本身就是体验。"], ["2", "看港池和帆船", "与开放海面不同，港池能让帆船中心身份一眼成立。"], ["3", "向情人坝/灯塔方向走一段", "体力够再走，不需要完整走到底。"], ["4", "找位置吃晚饭", "把夜景和休息合并，19:30左右结束。"]], "shots": [["浮山湾蓝调", "日落后约20–40分钟拍，天空仍蓝、楼体已亮灯。"], ["灯塔纵深", "防波堤做引导线，灯塔做终点。"], ["帆船前景", "用桅杆和船体做前景拍城市高楼，最有“帆船之都”辨识度。"]], "sources": [["Wikimedia Commons·奥帆中心", "https://commons.wikimedia.org/wiki/Category:Qingdao_International_Sailing_Centre"]], "hours": "全天开放", "ticket": "免费"}, "青岛啤酒博物馆": {"meta": "A · 90分钟 · 1903至今", "gallery": [{"src": "assets/img/Tsingtao-Brewery-Museum-outside-2024.jpg", "caption": "老厂房外观：红色德式工业建筑", "source": "https://commons.wikimedia.org/wiki/File:Tsingtao%20Brewery%20Museum%20outside%202024.jpg"}, {"src": "assets/img/Tsingtao-Brewery-Museum-inside-2024.jpg", "caption": "馆内：百年工厂与展陈叠加", "source": "https://commons.wikimedia.org/wiki/File:Tsingtao%20Brewery%20Museum%20inside%202024.jpg"}, {"src": "assets/img/Qingdao-Beer-Factory.jpg", "caption": "工厂历史建筑", "source": "https://commons.wikimedia.org/wiki/File:Qingdao%20Beer%20Factory.jpg"}, {"src": "assets/img/Tsingtau-Germania-Brauerei-1911.jpg", "caption": "1911年前后历史影像：把今天的品牌拉回工业起点", "source": "https://commons.wikimedia.org/wiki/File:Tsingtau%20Germania-Brauerei%20%281911%29.jpg"}], "quick": "这不是“品牌展厅”，而是一处仍与生产体系相连的工业遗产。青岛与啤酒的关系始于1903年，德、英商人在当时的租借地创办日耳曼啤酒公司青岛股份公司，厂址就在今天登州路56号一带。后来企业经历政权与资本更迭，最终成为中国本土品牌。你看馆时只抓住两条线：一条是“青岛为什么会出现现代啤酒工业”，另一条是“一座殖民时期工厂如何转化成今天最强的城市品牌之一”。", "history": [["1903-08-15", "日耳曼啤酒公司青岛股份公司成立，设计产能约2000吨/年，设备与工艺代表当时较先进水平。"], ["20世纪上半叶", "工厂先后经历不同政权与经营主体，啤酒生产没有简单中断，工业设施持续演变。"], ["1949以后", "企业进入新的国营与现代企业发展阶段，“青岛啤酒”逐渐成为全国及出口品牌。"], ["2003", "青啤百年之际，博物馆正式开馆，把老厂房、老设备、文献与正在运行的现代生产线整合进参观路线。"], ["2026现状", "馆方实行分时预约；馆内重要工业遗存包括1896年西门子电机、1903年紫铜糖化锅等。"]], "steps": [["1", "第一部分只抓时间线", "德国/英国资本创厂 → 工厂更迭 → 中国品牌化。文字很多，不需要逐字读。"], ["2", "重点看老设备", "紫铜糖化锅、老电机、发酵设施比海报更值得停。"], ["3", "新旧生产线对比", "看现代工业如何接续旧厂房，而不是把这里当静态古迹。"], ["4", "最后喝一杯/体验区", "这是博物馆最轻松的部分，也让“工业史”回到味觉。"]], "shots": [["红色老厂房", "外部正面最能说明“百年工业建筑”身份。"], ["历史影像对照", "图库里的1911影像可和今天外观对照。"], ["设备细节", "铜质锅炉、管线、铭牌适合拍局部，比展板更有质感。"]], "notes": ["2026年暑期起馆方公开实行分时预约。你去的是9月，仍建议提前选时段，不要当天临时赌名额。"], "sources": [["青岛市政府·青啤博物馆", "https://www.qingdao.gov.cn/yfqd/qdwl/cjfw/wyqbwzg/202009/t20200910_520368.shtml"], ["2026分时预约说明", "https://www.qingdao.gov.cn/zwgk/xxgk/whly/gkml/gzxx/202607/t20260721_10681621.shtml"], ["Wikimedia Commons", "https://commons.wikimedia.org/wiki/Category:Tsingtao_Brewery_Museum"]], "hours": "9/1–10/31 08:00–18:30（17:30停止入场）；11–4月 08:30–17:30", "ticket": "A+B双馆 ¥60（含品鉴）；建议提前线上分时预约"}, "广兴里": {"meta": "A · 20–25分钟 · 里院必看样本", "gallery": [{"src": "assets/img/青岛大鲍岛-广兴里.jpg", "caption": "广兴里外部：街道立面", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%A4%A7%E9%B2%8D%E5%B2%9B%E2%80%94%E2%80%94%E5%B9%BF%E5%85%B4%E9%87%8C.jpg"}, {"src": "assets/img/青岛广兴里内院-2022-02-06.jpg", "caption": "内院：最直观理解“外楼内院”", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E5%86%85%E9%99%A2%202022-02-06.jpg"}, {"src": "assets/img/青岛广兴里南侧内廊.jpg", "caption": "连廊：里院生活的核心空间", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E5%8D%97%E4%BE%A7%E5%86%85%E5%BB%8A.jpg"}, {"src": "assets/img/青岛广兴里俯瞰.jpg", "caption": "俯瞰：闭合院落格局", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E4%BF%AF%E7%9E%B0.jpg"}, {"src": "assets/img/青岛广兴里早期建筑后院旧影.jpg", "caption": "历史旧影：和今天修复后的院落对照", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E6%97%A9%E6%9C%9F%E5%BB%BA%E7%AD%91%E5%90%8E%E9%99%A2%E6%97%A7%E5%BD%B1.jpg"}], "quick": "如果你只认真看一座里院，就选广兴里。它是大鲍岛最有代表性的超大型商住里院之一。早期建筑在20世纪初形成，随后逐步扩展为多层建筑围合的大院。临街首层可以做商业，楼上与院内承担居住；院内又曾有市场、茶社、娱乐等功能。老青岛曾有“有钱不出广兴里”的说法，意思不是字面上富人不出门，而是强调这里商业和生活服务密度高到像一个微型城市。", "history": [["20世纪初", "广兴里早期建筑开始形成；随后分期建设，逐渐形成今天大体可识别的围合院落。"], ["商住混合", "外部是城市街墙和商铺，穿门洞后进入内部天井、连廊和住家空间。"], ["1940年代", "资料记载院内及周边商铺数量众多，还出现影院、茶社等娱乐功能，反映大鲍岛成熟的市民商业。"], ["1990s以后", "传统居住功能衰退，建筑状况一度恶化。"], ["2019以后", "修缮活化后重新开放，成为今天理解里院最直观的样本。"]], "steps": [["1", "外面先看整排街墙", "记住它看起来首先是一栋城市商业楼。"], ["2", "穿门洞进入内院", "这是最重要的空间转折，立即能理解“里院”为什么叫院。"], ["3", "站院中心仰头看三层回廊", "楼梯、廊道、门窗共同构成高密度日常生活的交通网络。"], ["4", "看一楼与楼上关系", "一层更接近公共商业，上层更接近居住；这就是青岛华商街区的效率。"], ["5", "找一处旧砖/旧木构与新店同框", "把修复后的当代使用也记录下来。"]], "shots": [["院中心0.5×仰拍", "最直接表现“几层楼围一方天空”。"], ["门洞框景", "用深色门洞框住明亮内院，空间反差很好看。"], ["回廊纵深", "站在一侧廊下顺着栏杆拍，强调连续性。"], ["历史对照", "图库里有广兴里旧影，先看旧照再找今天相似墙体和尺度。"]], "sources": [["青岛市政府·何以里院", "https://www.qingdao.gov.cn/ywdt/bmdt/202511/t20251117_10368597.shtml"], ["Wikimedia Commons·广兴里", "https://commons.wikimedia.org/wiki/Category:Guangxingli,_Qingdao"]], "hours": "全天开放（街区）", "ticket": "免费"}, "大鲍岛里院线": {"meta": "A · 45–60分钟 · 3+1个点", "gallery": [{"src": "assets/img/青岛大鲍岛-广兴里.jpg", "caption": "广兴里外部：街道立面", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%A4%A7%E9%B2%8D%E5%B2%9B%E2%80%94%E2%80%94%E5%B9%BF%E5%85%B4%E9%87%8C.jpg"}, {"src": "assets/img/青岛广兴里内院-2022-02-06.jpg", "caption": "内院：最直观理解“外楼内院”", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E5%86%85%E9%99%A2%202022-02-06.jpg"}, {"src": "assets/img/青岛广兴里南侧内廊.jpg", "caption": "连廊：里院生活的核心空间", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E5%8D%97%E4%BE%A7%E5%86%85%E5%BB%8A.jpg"}, {"src": "assets/img/青岛广兴里俯瞰.jpg", "caption": "俯瞰：闭合院落格局", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E4%BF%AF%E7%9E%B0.jpg"}, {"src": "assets/img/青岛广兴里早期建筑后院旧影.jpg", "caption": "历史旧影：和今天修复后的院落对照", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B9%BF%E5%85%B4%E9%87%8C%E6%97%A9%E6%9C%9F%E5%BB%BA%E7%AD%91%E5%90%8E%E9%99%A2%E6%97%A7%E5%BD%B1.jpg"}], "quick": "这条不是“逛商业街”，而是用不到1小时把青岛里院从建筑类型、商业史到今天的城市更新串起来。顺序建议：广兴里 → 里院记忆博物馆/街区 → 留意瑞蚨祥老字号 → 有余里（有时间再去）。前两项在大鲍岛核心区，最后的有余里更偏北，不够时间就不要硬加。", "history": [["1898以后", "大鲍岛成为华人居住、贸易和社会活动的重要区域，迅速吸纳各地商人。"], ["20世纪前半叶", "里院与会馆、老字号、市场共同发展；瑞蚨祥、谦祥益、亨得利等商业品牌进入，街区成为青岛华商核心。"], ["1930年代", "全市里院已达数百处，大鲍岛是最集中区域之一。"], ["今天", "修缮采取“最小干预”“新旧可辨”等原则，历史建筑重新装入餐饮、展览、零售与文化活动。"]], "steps": [["1", "广兴里 20–25m", "先把里院的空间结构看懂。"], ["2", "步行穿大鲍岛街巷 10–15m", "看不同里院门洞、清水砖墙、木回廊；不要只追店名。"], ["3", "里院记忆博物馆 15–20m", "如果开放且不用排队，快速看老青岛生活场景；排队就跳过。"], ["4", "瑞蚨祥牌匾/老字号痕迹", "沿街留意即可，理解大鲍岛不仅是住宅区，也是华商商业中心。"], ["5", "有余里 B", "长山路13号，因电影《抓娃娃》取景走红；百年石榴树、手绘墙、复古邮筒是打卡点。离核心区更远，行程紧就删。"]], "shots": [["广兴里内院", "必拍。"], ["街巷门洞", "让门洞里出现另一座院子或行人，表现“串里串院”。"], ["新旧同框", "旧砖木构＋新店招牌，记录更新后的真实状态。"], ["有余里", "若去：石榴树、手绘墙、复古邮筒三项选一，不必全拍。"]], "sources": [["青岛市政府·何以里院", "https://www.qingdao.gov.cn/ywdt/bmdt/202511/t20251117_10368597.shtml"], ["青岛市政府·大鲍岛前世今生", "https://www.qingdao.gov.cn/ywdt/qsdt/202205/t20220506_6036629.shtml"], ["2026老城更新", "https://www.qingdao.gov.cn/ywdt/qsdt/202608/t20260807_10696585.shtml"]], "hours": "街区全天；里院记忆博物馆 09:00–12:00 / 13:30–17:30（中午休息）", "ticket": "街区免费；博物馆免费免预约"}, "有余里": {"meta": "B · 20分钟 · 电影取景 / 当代打卡", "gallery": [], "quick": "有余里不是这趟最重要的历史建筑，但如果你对当代影视取景和“老建筑如何变成新网红点”感兴趣，可以顺便去。长山路13号的院子因电影《抓娃娃》取景走红，官方文旅点名的打卡元素包括百年石榴树、墙面手绘和门口复古邮筒。", "history": [["历史层", "它仍属于青岛里院与老城区的建筑语境。"], ["当代层", "影视取景把原本普通的院落细节重新包装成大众识别的“电影场景”，是老城更新后非常典型的传播路径。"]], "steps": [["1", "进院先找石榴树", "这是空间记忆点。"], ["2", "墙面手绘/邮筒快速拍", "10分钟足够。"], ["3", "不为它单独跨城", "只在Day23还有时间时加。"]], "shots": [["电影感", "人物站在院门/墙画旁，留出旧院落背景。"]], "sources": [["青岛市政府·何以里院", "https://www.qingdao.gov.cn/ywdt/bmdt/202511/t20251117_10368597.shtml"]], "hours": "全天开放（街区）", "ticket": "免费"}, "崂山仰口": {"meta": "S · 2.5–3小时 · 山海主场", "gallery": [{"src": "assets/img/Coast-View---panoramio-1.jpg", "caption": "崂山经典：山体直接落向海面", "source": "https://commons.wikimedia.org/wiki/File:Coast%20View%20-%20panoramio%20%281%29.jpg"}, {"src": "assets/img/Coastal-Shot---panoramio.jpg", "caption": "海岸与山石", "source": "https://commons.wikimedia.org/wiki/File:Coastal%20Shot%20-%20panoramio.jpg"}, {"src": "assets/img/青岛崂山---山下海边---panoramio.jpg", "caption": "山下海边：理解“海上名山”", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E5%B4%82%E5%B1%B1%20-%20%E5%B1%B1%E4%B8%8B%E6%B5%B7%E8%BE%B9%20-%20panoramio.jpg"}, {"src": "assets/img/Laoshan.jpg", "caption": "崂山整体山景", "source": "https://commons.wikimedia.org/wiki/File:Laoshan.jpg"}], "quick": "仰口最适合你，因为它把“山＋海＋道教人文”压缩在一条2–3小时线路里。官方路线是太平宫—狮子峰—犹龙洞—仙桃—寿字峰—觅天洞—天苑。你不需要为了完整性全走：重点锁定太平宫、寿字峰、山海视野；觅天洞狭窄且偏暗，如果排队、累或不喜欢钻洞可以跳过。官方也明确建议赶时间者可利用索道。", "history": [["道教背景", "崂山长期是北方重要道教名山。仰口的太平宫与宋代道士刘若拙关系密切。"], ["960", "太平宫相传始建于宋建隆元年。刘若拙受封后在此修行，形成仰口人文核心。"], ["寿字峰", "巨石壁上分布大量“寿”字，形成百寿图；官方资料称最大“寿”字高约20米、宽约16米。"], ["自然景观", "仰口背山面海，最特别的不是单一峰石，而是山体陡然面向黄海、海湾在脚下展开的空间感。"]], "steps": [["1", "游客中心/观光车进入", "以当天景区组织为准。"], ["2", "太平宫", "先把道教故事看懂，之后山路不会只剩“爬”。"], ["3", "狮子峰/沿途山海视野", "不断回头看仰口湾，经典照片就在这一段。"], ["4", "寿字峰", "看百寿图和最大寿字，停10分钟足够。"], ["5", "觅天洞：自行决定", "洞内黑、窄、排队时容易拖时间；不想钻直接跳。"], ["6", "索道回程优先", "如果当天腿累，优先把体力留给下午SPA与第二天返程。"]], "shots": [["经典山海照", "找能同时看到岩体/松树与仰口湾的高点，用1×或2×，不要只拍天空。"], ["寿字峰＋海", "如果角度允许，让石刻做前景、海湾做远景，这是仰口辨识度很高的构图。"], ["索道视角", "下行索道更容易持续看到海，可把缆车框架当自然边框。"]], "notes": ["9月官方常规运营时段为7:00–17:30，景区实行预约购票。天气、大风可能临时影响开放和索道，出发前一天再确认。"], "sources": [["崂山官方·仰口攻略", "https://www.qdlaoshan.cn/New-Jing-info-jid-726.html"], ["崂山官方·仰口微官网", "https://qdlaoshan.cn/Wap-Index-jinginfo-jid-495.html"], ["Wikimedia Commons·崂山", "https://commons.wikimedia.org/wiki/Category:Laoshan_Mountain"]], "hours": "9/1–11/30 07:00–17:30（大风等天气可能临时关闭）", "ticket": "旺季(4/15–10/31) 太清+仰口联票 ¥130 含观光车、3天有效；「崂山风景区」公众号实名预约"}, "石老人": {"meta": "A/B · 30–40分钟 · 24晚/25早二选一", "gallery": [{"src": "assets/img/20240730-Shilaoren-Beach-Qingdao.jpg", "caption": "石老人海水浴场：宽阔海岸", "source": "https://commons.wikimedia.org/wiki/File:20240730%20Shilaoren%20Beach%2C%20Qingdao.jpg"}, {"src": "assets/img/青岛石老人-2008-10-30.jpg", "caption": "海蚀柱“石老人”本体", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E7%9F%B3%E8%80%81%E4%BA%BA%202008-10-30.jpg"}, {"src": "assets/img/石老人20260526.jpg", "caption": "近年视角：海蚀柱与海面", "source": "https://commons.wikimedia.org/wiki/File:%E7%9F%B3%E8%80%81%E4%BA%BA20260526.jpg"}, {"src": "assets/img/青岛石老人海水浴场20260526.jpg", "caption": "沙滩视角", "source": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%B2%9B%E7%9F%B3%E8%80%81%E4%BA%BA%E6%B5%B7%E6%B0%B4%E6%B5%B4%E5%9C%BA20260526.jpg"}], "quick": "“石老人”首先是一个海蚀地貌：离岸岩柱长期受海浪侵蚀，形态远看像一位老人坐在海中，因此得名。民间又发展出“老人等待被龙王带走的女儿，最终化成石头”的传说。两者要分开：前者是地貌事实，后者是城市海洋民间故事。你真正来这里的理由，是东部海岸更开阔、适合在崂山之后把旅行慢下来。", "history": [["自然形成", "海岸岩体在长期侵蚀下形成离岸海蚀柱，传统资料记载露出海面约15米。"], ["民间传说", "老人盼女化石的故事让地貌获得人格化名字，后来成为青岛最知名的海洋传说之一。"], ["现代海滨", "周边建设大型海水浴场，与东部城市发展、崂山区滨海公共空间相连。"]], "steps": [["1", "24日晚和25早只选一次", "天气好、腿不累就24日晚；否则25早晨。"], ["2", "沿沙滩走到能看见海蚀柱的方向", "不用长距离徒步。"], ["3", "拍完海岸就撤", "30–40分钟足够，返程日不要把体力浪费在来回走。"]], "shots": [["海蚀柱长焦", "用2×/3×让“石老人”在海面上更明显。"], ["沙滩纵深", "0.5×拍沙滩、海、城市，记录东部海岸尺度。"], ["日出经典思路", "网上最经典的画面之一是太阳与海蚀柱同框/接近重合。太阳方位每天变化，不保证9/25能精准对齐；到现场用天气/日出App确认方位再移动机位。"]], "sources": [["Wikimedia Commons·石老人海水浴场", "https://commons.wikimedia.org/wiki/File:20240730_Shilaoren_Beach,_Qingdao.jpg"]], "hours": "全天开放（海水浴场）", "ticket": "免费"}, "里院·十号房": function renderArrival(d){
 arrival.innerHTML="";let n=1;
 d.events.forEach((e,i)=>{let [t,label,name,p,lat,lng,g]=e;if(label==="到达"&&lat&&lng&&showP(p)){let b=document.createElement("button");b.className=`arriveCard ${p}`;b.innerHTML=`<span class="arriveNo">${n++}</span><div class="arriveTime">${localStorage.getItem(`time-${d.id}-${i}`)||t}</div><div class="arriveName">${name}</div>`;b.onclick=()=>g?openGuide(g,name,lat,lng):window.open(amapNav(name,lat,lng),"_blank");arrival.appendChild(b)}});
}
function render(){
 const d=DAYS[current];$("#coverImg").src=d.cover;$("#coverDate").textContent=d.date;$("#coverSource").href=d.coverSource;
 [...document.querySelectorAll(".daybtn")].forEach((x,i)=>x.classList.toggle("active",i===current));
 summary.innerHTML=d.summary.map(x=>`<span class="chip">${x}</span>`).join("");document.getElementById("routePreviewImg").src=`assets/route-${d.id}.png`;renderArrival(d);timeline.innerHTML="";renderTransport();renderCustom();
 d.events.forEach((e,i)=>{let [t,label,name,p,lat,lng,g]=e;let row=document.createElement("div");row.className=`event ${p} ${showP(p)?"":"hidden"}`;let k=`done-${d.id}-${i}`;if(localStorage.getItem(k)==="1")row.classList.add("done");
 let ptxt=p==="s"?"S":p==="a"?"A":p==="b"?"B":"●";
 row.innerHTML=`<div class="etime">${localStorage.getItem(`time-${d.id}-${i}`)||t}</div><div class="edot"></div><div><div class="elabel">${label}</div><div class="ename">${name}<span class="prio">${ptxt}</span></div></div><div class="eactions">${g?'<button class="ebtn detail">›</button>':""}${lat?'<button class="ebtn nav">↗</button>':""}</div>`;
 row.querySelector(".edot").onclick=()=>{let on=row.classList.toggle("done");localStorage.setItem(k,on?"1":"0")};
 row.querySelector(".etime").onclick=()=>{let el=row.querySelector(".etime"),v=prompt("时间",el.textContent);if(v){el.textContent=v;localStorage.setItem(`time-${d.id}-${i}`,v);renderArrival(d)}};
 if(g)row.querySelector(".detail").onclick=()=>openGuide(g,name,lat,lng);if(lat)row.querySelector(".nav").onclick=()=>window.open(amapNav(name,lat,lng),"_blank");timeline.appendChild(row);
 });
}
function openGuide(key,navName,navLat,navLng){
 const g=GUIDES[key];if(!g)return;$("#gName").textContent=key;$("#gMeta").textContent=g.meta||"";
 let info="";if(g.hours)info+=`<div class="gInfoRow"><span class="gInfoK">营业</span><span class="gInfoV">${g.hours}</span></div>`;if(g.ticket)info+=`<div class="gInfoRow"><span class="gInfoK">购票/预约</span><span class="gInfoV">${g.ticket}</span></div>`;$("#gInfo").innerHTML=info?`<div class="gInfo">${info}</div>`:"";
 let gal=""; if(g.gallery&&g.gallery.length){gal=`<div class="gallery">`+g.gallery.map(x=>`<div class="photo"><img loading="lazy" src="${x.src}" alt="${x.caption}" onerror="this.style.display='none'"><div class="photoCap">${x.caption}</div><a class="photoSource" href="${x.source}" target="_blank">图源</a></div>`).join("")+`</div>`} $("#gGallery").innerHTML=gal;
 let body=`<section class="gsection"><div class="gtitle">30秒看懂</div><p class="gtext">${g.quick||""}</p></section>`;
 if(g.history?.length)body+=`<section class="gsection"><div class="gtitle">历史脉络</div><div class="hist">`+g.history.map(x=>`<div class="hyear">${x[0]}</div><div class="htext">${x[1]}</div>`).join("")+`</div></section>`;
 if(g.steps?.length)body+=`<section class="gsection"><div class="gtitle">现场按这个顺序看</div>`+g.steps.map(x=>`<div class="step"><div class="stepNo">${x[0]}</div><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join("")+`</section>`;
 if(g.shots?.length)body+=`<section class="gsection"><div class="gtitle">经典机位</div>`+g.shots.map(x=>`<div class="shot"><b>${x[0]}</b><p>${x[1]}</p></div>`).join("")+`</section>`;
 if(g.notes?.length)body+=`<section class="gsection"><div class="gtitle">提醒 / 辨伪</div>`+g.notes.map(x=>`<div class="note">${x}</div>`).join("")+`</section>`;
 if(g.sources?.length)body+=`<section class="gsection sources"><div class="gtitle">资料</div>`+g.sources.map(x=>`<a href="${x[1]}" target="_blank">${x[0]} ↗</a>`).join("")+`</section>`;
 $("#gBody").innerHTML=body;$("#guideNav").href=amapNav(navName||key,navLat,navLng);$("#guideXhs").href=xhsSearch(navName||key);$("#guideOverlay").classList.add("open");$("#guide").scrollTop=0;
}
$("#gClose").onclick=()=>$("#guideOverlay").classList.remove("open");$("#guideOverlay").onclick=e=>{if(e.target.id==="guideOverlay")e.currentTarget.classList.remove("open")};
DAYS.forEach((d,i)=>{let b=document.createElement("button");b.className="daybtn";b.textContent=d.id;b.onclick=()=>{current=i;render()};daysEl.insertBefore(b,daysEl.querySelector(".filters"))});
document.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".fbtn").forEach(x=>x.classList.toggle("on",x===b));render()});
render();
</script>
</body>
</html>
