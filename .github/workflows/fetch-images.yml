name: fetch-wikimedia-images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images from Wikimedia
        run: python3 tools/fetch_images_ci.py

      - name: Commit and push
        run: |
          git config user.name "solotrip-qd[bot]"
          git config user.email "solotrip-qd[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: fetch wikimedia attraction images into assets/img"
            git push
          fi
